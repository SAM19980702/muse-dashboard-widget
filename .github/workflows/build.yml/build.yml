name: Build unsigned IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build app (unsigned)
        run: |
          xcodebuild -project MuseDashboard.xcodeproj -scheme MuseDashboard -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO -derivedDataPath build
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/MuseDashboard.app Payload/
          zip -qry MuseDashboard-unsigned.ipa Payload
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MuseDashboard-unsigned
          path: MuseDashboard-unsigned.ipa
      - name: Publish release v1.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0 MuseDashboard-unsigned.ipa --title "Muse 仪表盘 v1.0" --notes "未签名 IPA，用 LCSign 签名后安装。" || gh release upload v1.0 MuseDashboard-unsigned.ipa --clobber


# registered
